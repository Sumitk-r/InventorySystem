services:
  - type: web
    name: inventory-system-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: INVENTORY_DB
        value: /var/data/inventory.db
      - key: CORS_ORIGINS
        value: https://inventory-system-web.onrender.com
    disk:
      name: inventory-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: inventory-system-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE
        value: https://inventory-system-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
